# ROADMAP.md "Queue status" is generated from design-plan.json (scripts/sync-roadmap.mjs, #640). Fails when they drift.
# Separate from themes.yml on purpose: that workflow skips *.md changes and publishes releases; a stale roadmap must
# never block a theme release, and a hand edit of ROADMAP.md alone must still be checked.
name: roadmap

on:
  push:
    branches: [main]
    paths: ['ROADMAP.md', 'design-plan.json', 'scripts/sync-roadmap*.mjs', '.github/workflows/roadmap.yml']
  pull_request:
    paths: ['ROADMAP.md', 'design-plan.json', 'scripts/sync-roadmap*.mjs', '.github/workflows/roadmap.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ROADMAP.md
            /design-plan.json
            /scripts/sync-roadmap.mjs
            /scripts/sync-roadmap.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test sync-roadmap and check ROADMAP.md against design-plan.json
        run: node --test scripts/sync-roadmap.test.mjs && node scripts/sync-roadmap.mjs --check
