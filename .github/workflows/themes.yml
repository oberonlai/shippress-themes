# Checks every theme on pull requests and pushes. On main, publishes each new theme version to its own immutable
# release and refreshes the moving "themes" release:
#   https://github.com/oberonlai/shippress-themes/releases/download/<slug>-v<Version>/<slug>.zip   never changes (ShipPress pins this + sha256)
#   https://github.com/oberonlai/shippress-themes/releases/download/themes/<slug>.zip              always the newest (for people)
#   https://github.com/oberonlai/shippress-themes/releases/download/themes/releases.json           slug, version, url, sha256 per theme
# Note: a squash merge that carries a "[skip ci]" line skips this run; republish with a PR that touches this file.
# A theme whose files changed needs a new Version in its style.css: pull requests fail early, and a push never
# replaces a published version (scripts/release-themes.mjs). Stock actions + the preinstalled gh CLI only.
name: themes

# Root docs (README, ROADMAP) and catalogue screenshots never change a zip (screenshots/ is left out of them), so they skip
# this workflow (#15). Pull requests cancel their own older run; publishing on main never cancels.
# Note: GitHub skips the whole push run when the merge commit message (body included) contains a skip-ci marker, so a
# squash merge must not carry one over from a ROADMAP/screenshot commit on the branch, or the new version is not published.
# That includes the ROADMAP "claim" commit a theme round makes at its start: leave the marker off it (#26 and #162 had to be re-published).
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', 'themes/*/screenshots/**', 'ROADMAP.md', 'LICENSE']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'themes/*/screenshots/**', 'ROADMAP.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

# One publishing run at a time (two pushes must not race to create the same tag); pull requests check on their own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('themes-pr-{0}', github.ref) || 'themes-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check themes
        run: node --test scripts/check-themes.test.mjs scripts/release-themes.test.mjs scripts/komugi-bake-board.test.mjs scripts/sync-screenshots.test.mjs && node scripts/check-themes.mjs
      - name: Build one zip per theme
        run: |
          mkdir -p dist
          cd themes
          # Reproducible zips: fixed timestamps, sorted entries, no extra attributes, so a theme's zip (and the sha256
          # pinned in the ShipPress app catalogue) only changes when that theme's files change.
          # Catalogue screenshots (scripts/sync-screenshots.mjs) are not part of a theme: leave out screenshots/ and the
          # README section that shows them (stripped on this throwaway checkout), so syncing them never changes a zip.
          node ../scripts/sync-screenshots.mjs --strip
          for d in */; do slug="${d%/}"
            find "$slug" -path "$slug/screenshots" -prune -o -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
            find "$slug" -path "$slug/screenshots" -prune -o -print | LC_ALL=C sort | TZ=UTC zip -qX "../dist/$slug.zip" -@
            sha256sum "../dist/$slug.zip"
          done
      # Pull requests: read-only check that no released version would change. main: publish new versions first, so
      # releases.json never names a download that doesn't exist yet.
      - name: Versioned releases (<slug>-v<Version>, never overwritten)
        run: node scripts/release-themes.mjs --dist dist ${{ env.PUBLISH == 'true' && '--publish' || '' }}
      - name: Refresh the moving "themes" release and releases.json
        if: env.PUBLISH == 'true'
        run: |
          gh release view themes >/dev/null 2>&1 || gh release create themes --title "Themes" --latest --notes "The newest zip of every theme, rebuilt on every push to main. Install: WordPress admin → Appearance → Themes → Add New Theme → Upload Theme. Each version also has its own release (<slug>-v<version>) whose download never changes; releases.json lists them with their sha256."
          gh release upload themes dist/*.zip dist/releases.json --clobber
