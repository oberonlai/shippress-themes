  <stop offset="0.4" stop-color="#C9BFA8"/>
  <stop offset="1" stop-color="#A9B39A"/>
</linearGradient>
<radialGradient id="sieveRim" cx="34%" cy="32%" r="72%">
  <stop offset="0" stop-color="#C9BFA8"/>
