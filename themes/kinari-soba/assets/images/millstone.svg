  <stop offset="1" stop-color="#A9B39A"/>
</radialGradient>
<radialGradient id="meshBed" cx="40%" cy="36%" r="70%">
  <stop offset="0" stop-color="#ECEDE8"/>
  <stop offset="0.6" stop-color="#DADDD3"/>
  <stop offset="1" stop-color="#A9B39A" stop-opacity="0.75"/>
</radialGradient>
</defs>

