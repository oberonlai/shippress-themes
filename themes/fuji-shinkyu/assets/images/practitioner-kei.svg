<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A geometric portrait of Kei with short hair inside a pale lilac circle, a gold point at the collar">
