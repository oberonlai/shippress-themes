<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Concentric lilac circles widening around a gold point, marked in for four and out for six">
<title>Concentric lilac circles widening around a gold point, marked in for four and out for six</title>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="91" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.48  0 0 0 0.5 -0.2"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="soft8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B7A3D8" stop-opacity=".45"/><stop offset="1" stop-color="#B7A3D8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowgold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E9D7A8" stop-opacity=".7"/><stop offset="1" stop-color="#E9D7A8" stop-opacity="0"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1EDF6"/><stop offset="1" stop-color="#FAF8FC"/></linearGradient>
</defs>
<rect width="1200" height="1200" fill="#FAF8FC"/>
<rect width="1200" height="1200" fill="#F1EDF6"/><circle cx="600" cy="600" r="560" fill="url(#glow)"/><circle cx="600" cy="600" r="60" fill="none" stroke="#6A4C93" stroke-width="3.20" opacity="0.85"/><circle cx="600" cy="600" r="120" fill="none" stroke="#B7A3D8" stroke-width="2.85" opacity="0.75"/><circle cx="600" cy="600" r="190" fill="none" stroke="#6A4C93" stroke-width="2.50" opacity="0.65"/><circle cx="600" cy="600" r="270" fill="none" stroke="#B7A3D8" stroke-width="2.15" opacity="0.55"/><circle cx="600" cy="600" r="360" fill="none" stroke="#6A4C93" stroke-width="1.80" opacity="0.45"/><circle cx="600" cy="600" r="460" fill="none" stroke="#B7A3D8" stroke-width="1.45" opacity="0.35"/><circle cx="600" cy="600" r="570" fill="none" stroke="#6A4C93" stroke-width="1.10" opacity="0.25"/><circle cx="600" cy="600" r="150" fill="#FAF8FC" opacity=".5"/><circle cx="600" cy="600" r="10" fill="#A88848"/><circle cx="600" cy="600" r="26.0" fill="none" stroke="#A88848" stroke-width="1.2" opacity=".6"/><text x="600" y="420" text-anchor="middle" font-family="Urbanist, Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#665D73">IN · 4</text><text x="600" y="800" text-anchor="middle" font-family="Urbanist, Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#665D73">OUT · 6</text>
<rect width="1200" height="1200" filter="url(#grain)" opacity=".55"/>
</svg>
